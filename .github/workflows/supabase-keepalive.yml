# Keeps the free-tier Supabase project from auto-pausing.
#
# Free projects pause after seven days with no database requests. This site's
# public pages are prerendered, so a quiet week — no deploy, no admin edit, no
# visitor hitting a dynamic route — reaches the database zero times and the
# project goes to sleep. Waking it is manual, and until someone does, the admin
# panel and every /api/media image are down.
#
# One request every three days is enough to reset that clock, with room for a
# missed run: GitHub drops scheduled jobs under load, and the day-of-month cron
# below has a two-day gap at the end of a 31-day month. Worst case is still well
# inside seven days.
name: Supabase keep-alive

on:
  schedule:
    # 06:00 UTC on the 1st, 4th, 7th … of each month.
    - cron: '0 6 */3 * *'
  # So this can be proven to work without waiting three days for a schedule.
  workflow_dispatch:

# The job only reads. Nothing here needs write access to the repository, and a
# public repo's workflow should ask for the least it can.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout and no setup-node: curl is already on the runner and this
      # needs nothing from the repository. Keeps the run at a few seconds.
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "SUPABASE_URL or SUPABASE_SECRET_KEY is missing from repository secrets."
            exit 1
          fi

          # HEAD-style count query: asks PostgREST for the row count and no rows,
          # so the response body is empty regardless of catalogue size. `set -x`
          # is deliberately not used — it would echo the Authorization header,
          # and this repository's logs are public.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
            -X HEAD \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            -H "Prefer: count=exact" \
            "${SUPABASE_URL}/rest/v1/projects?select=id&limit=1")

          echo "PostgREST responded ${status}"

          # A non-2xx is worth failing on rather than logging quietly. If the key
          # was rotated and this workflow's secret was not updated, the ping stops
          # counting as activity and the project pauses anyway — silently, which
          # is the failure this whole workflow exists to prevent.
          case "$status" in
            2*) echo "Database reached — the pause timer is reset." ;;
            *) echo "Unexpected status. The keep-alive did NOT reach the database."; exit 1 ;;
          esac
