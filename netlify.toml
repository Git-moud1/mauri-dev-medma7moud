[build]
  command = "npm run build"
  publish = ".next"

  [build.environment]
    # Next 16 requires Node 20.9+. This site was created against Next 14, so
    # whatever default it inherited then is not necessarily new enough — and a
    # too-old Node fails the build with an error that does not mention Node.
    # Pinned here so the requirement travels with the repo instead of living in
    # the Netlify UI.
    NODE_VERSION = "22.11.0"

# Official Next.js runtime — enables next/image optimization, SSR & API routes.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# CACHE RULES ONLY. Do not add security headers here.
#
# netlify.toml [[headers]] are applied by the CDN to files it serves. HTML
# documents come from the Next.js runtime's function and never see them.
# Verified on deploy-preview-1: the identical rule set lived here, was correct,
# and reached `/_next/static/*` while every page response went out with no CSP,
# no Referrer-Policy and no Permissions-Policy for the life of the branch.
#
# Security headers now live in next.config.mjs `headers()`, which the framework
# serves on its own responses. Moving them back here silently disables them.
#
# Caching is the half that does work from this file, so it stays.

# Build-hashed filenames, so the content behind a URL never changes.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Bundled project media. Filenames are stable rather than hashed, so this is a
# deliberate bet that an image is replaced under a new name, not overwritten.
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
