<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif" role="img" aria-label="Swift Eats — Restaurant menu">
  <defs>
    <linearGradient id="s2-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAF8FB"/></linearGradient>
    <linearGradient id="s2-heroScrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.34"/><stop offset="0.32" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.30"/></linearGradient>
    <linearGradient id="s2-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/><stop offset="1" stop-color="#000000" stop-opacity="0.14"/></linearGradient>
    <filter id="s2-cartsh" x="-30%" y="-120%" width="160%" height="340%"><feDropShadow dx="0" dy="-6" stdDeviation="14" flood-color="#2A1B3A" flood-opacity="0.10"/></filter>
    <filter id="s2-addsh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#C13A12" flood-opacity="0.35"/></filter>
    <clipPath id="s2-heroClip"><rect x="0" y="0" width="390" height="268"/></clipPath>
    <clipPath id="s2-i1"><rect x="286" y="462" width="84" height="84" rx="18"/></clipPath>
    <clipPath id="s2-i2"><rect x="286" y="566" width="84" height="84" rx="18"/></clipPath>
    <clipPath id="s2-i3"><rect x="286" y="670" width="84" height="84" rx="18"/></clipPath>
  </defs>

  <rect width="390" height="844" fill="url(#s2-bg)"/>

  <!-- ===== hero image ===== -->
  <g clip-path="url(#s2-heroClip)">
    <image href="__PH_menu_hero__" x="0" y="0" width="390" height="268" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="390" height="268" fill="url(#s2-heroScrim)"/>
  </g>

  <!-- status bar (light on hero) -->
  <text x="32" y="36" font-size="16" font-weight="700" fill="#fff" letter-spacing="0.2">9:41</text>
  <g fill="#fff"><rect x="306" y="24" width="3.5" height="11" rx="1.4"/><rect x="312" y="21" width="3.5" height="14" rx="1.4"/><rect x="318" y="18" width="3.5" height="17" rx="1.4"/><rect x="324" y="15" width="3.5" height="20" rx="1.4"/></g>
  <g transform="translate(346,30)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><path d="M-8 -6a11.5 11.5 0 0 1 16 0"/><path d="M-4.6 -1.8a6.6 6.6 0 0 1 9.2 0"/></g>
  <circle cx="346" cy="30" r="1.5" fill="#fff"/>
  <rect x="356" y="23" width="22" height="11" rx="3" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.2"/><rect x="358" y="25" width="15" height="7" rx="1.6" fill="#fff"/>

  <!-- hero controls -->
  <g transform="translate(20,60)"><circle cx="19" cy="19" r="19" fill="#fff"/><path d="M23 11l-8 8 8 8" fill="none" stroke="#16151A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(294,60)"><circle cx="19" cy="19" r="19" fill="#fff"/><g transform="translate(9,9)" fill="none" stroke="#16151A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="10" r="2.6"/><circle cx="16" cy="4" r="2.6"/><circle cx="16" cy="16" r="2.6"/><path d="M6.3 8.8l7.4-3.6M6.3 11.2l7.4 3.6"/></g></g>
  <g transform="translate(334,60)"><circle cx="19" cy="19" r="19" fill="#fff"/><path d="M19 27c-7-4.6-11-8-11-12.4a4.4 4.4 0 0 1 11-1.4 4.4 4.4 0 0 1 11 1.4c0 4.4-4 7.8-11 12.4z" fill="#F5471E"/></g>

  <!-- ===== white sheet ===== -->
  <rect x="0" y="244" width="390" height="600" rx="28" fill="#fff"/>
  <rect x="0" y="268" width="390" height="576" fill="#fff"/>

  <!-- restaurant identity -->
  <text x="24" y="300" font-size="22" font-weight="800" fill="#16151A">Napoli Pizza House</text>
  <g transform="translate(258,286)"><circle cx="8" cy="8" r="8" fill="#3B82F6"/><path d="M4.5 8.2l2.4 2.4 4.6-4.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(24,314)"><path d="M8 0l2.4 4.9 5.4.8-3.9 3.8.9 5.4L8 12.6 3.1 15.1l.9-5.4L.1 5.7l5.4-.8z" fill="#FFB020"/></g>
  <text x="46" y="327" font-size="13.5" font-weight="700" fill="#16151A">4.8</text>
  <text x="70" y="327" font-size="13.5" fill="#9A99A5">(1,240) · Italian · Pizza · $$</text>

  <!-- info chips -->
  <g transform="translate(24,346)">
    <rect x="0" y="0" width="104" height="34" rx="12" fill="#F4F2F7"/>
    <g transform="translate(12,9)"><circle cx="8" cy="8" r="8" fill="none" stroke="#12B76A" stroke-width="1.8"/><path d="M8 4v4l2.6 1.8" fill="none" stroke="#12B76A" stroke-width="1.8" stroke-linecap="round"/></g>
    <text x="34" y="22" font-size="12.5" font-weight="700" fill="#3A3944">25–35 min</text>
    <rect x="114" y="0" width="98" height="34" rx="12" fill="#F4F2F7"/>
    <g transform="translate(126,11)" fill="none" stroke="#F5471E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="10" r="2.4"/><circle cx="14" cy="10" r="2.4"/><path d="M6.4 10h5.2M2 10V5h6l3 3"/></g>
    <text x="146" y="22" font-size="12.5" font-weight="700" fill="#3A3944">$2 delivery</text>
    <rect x="222" y="0" width="78" height="34" rx="12" fill="#F4F2F7"/>
    <g transform="translate(234,9)"><path d="M8 0a6.5 6.5 0 0 1 6.5 6.5C14.5 11 8 17 8 17S1.5 11 1.5 6.5A6.5 6.5 0 0 1 8 0z" fill="none" stroke="#7C7B87" stroke-width="1.8"/><circle cx="8" cy="6.5" r="2.3" fill="none" stroke="#7C7B87" stroke-width="1.8"/></g>
    <text x="252" y="22" font-size="12.5" font-weight="700" fill="#3A3944">1.5 km</text>
  </g>

  <rect x="24" y="398" width="342" height="1" fill="#EFEDF2"/>

  <!-- category tabs -->
  <g font-size="14" font-weight="700">
    <text x="24" y="428" fill="#16151A">Popular</text>
    <rect x="24" y="438" width="52" height="3" rx="1.5" fill="#F5471E"/>
    <text x="100" y="428" fill="#9A99A5">Pizza</text>
    <text x="160" y="428" fill="#9A99A5">Pasta</text>
    <text x="222" y="428" fill="#9A99A5">Sides</text>
    <text x="286" y="428" fill="#9A99A5">Drinks</text>
  </g>
  <rect x="24" y="440" width="342" height="1" fill="#EFEDF2"/>

  <!-- ===== menu item 1 ===== -->
  <text x="24" y="482" font-size="15.5" font-weight="800" fill="#16151A">Margherita Classica</text>
  <text x="24" y="504" font-size="12.5" fill="#8C8B97">San Marzano tomato, fior di latte,</text>
  <text x="24" y="521" font-size="12.5" fill="#8C8B97">fresh basil, extra-virgin olive oil.</text>
  <text x="24" y="544" font-size="15" font-weight="800" fill="#16151A">$12.50</text>
  <image href="__PH_menu_1__" x="286" y="462" width="84" height="84" preserveAspectRatio="xMidYMid slice" clip-path="url(#s2-i1)"/>
  <rect x="286" y="462" width="84" height="84" rx="18" fill="url(#s2-gloss)" clip-path="url(#s2-i1)"/>
  <g filter="url(#s2-addsh)"><circle cx="356" cy="536" r="15" fill="#fff"/></g>
  <path d="M356 530v12M350 536h12" stroke="#F5471E" stroke-width="2.6" stroke-linecap="round"/>

  <!-- ===== menu item 2 ===== -->
  <text x="24" y="586" font-size="15.5" font-weight="800" fill="#16151A">Pepperoni Diavola</text>
  <text x="24" y="608" font-size="12.5" fill="#8C8B97">Spicy pepperoni, mozzarella, chili</text>
  <text x="24" y="625" font-size="12.5" fill="#8C8B97">flakes, oregano, tomato base.</text>
  <text x="24" y="648" font-size="15" font-weight="800" fill="#16151A">$14.90</text>
  <image href="__PH_menu_2__" x="286" y="566" width="84" height="84" preserveAspectRatio="xMidYMid slice" clip-path="url(#s2-i2)"/>
  <rect x="286" y="566" width="84" height="84" rx="18" fill="url(#s2-gloss)" clip-path="url(#s2-i2)"/>
  <g filter="url(#s2-addsh)"><circle cx="356" cy="640" r="15" fill="#fff"/></g>
  <path d="M356 634v12M350 640h12" stroke="#F5471E" stroke-width="2.6" stroke-linecap="round"/>

  <!-- ===== menu item 3 (peek) ===== -->
  <text x="24" y="690" font-size="15.5" font-weight="800" fill="#16151A">Napoletana Rustica</text>
  <text x="24" y="712" font-size="12.5" fill="#8C8B97">Cherry tomato, buffalo mozzarella,</text>
  <text x="24" y="729" font-size="12.5" fill="#8C8B97">basil, oregano, olive oil.</text>
  <text x="24" y="752" font-size="15" font-weight="800" fill="#16151A">$15.50</text>
  <image href="__PH_menu_3__" x="286" y="670" width="84" height="84" preserveAspectRatio="xMidYMid slice" clip-path="url(#s2-i3)"/>
  <rect x="286" y="670" width="84" height="84" rx="18" fill="url(#s2-gloss)" clip-path="url(#s2-i3)"/>
  <g filter="url(#s2-addsh)"><circle cx="356" cy="744" r="15" fill="#fff"/></g>
  <path d="M356 738v12M350 744h12" stroke="#F5471E" stroke-width="2.6" stroke-linecap="round"/>

  <!-- ===== view cart bar ===== -->
  <g filter="url(#s2-cartsh)"><rect x="0" y="770" width="390" height="74" fill="#fff"/></g>
  <rect x="20" y="782" width="350" height="52" rx="16" fill="#F5471E"/>
  <rect x="30" y="794" width="28" height="28" rx="9" fill="#fff" fill-opacity="0.22"/>
  <text x="44" y="813" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  <text x="70" y="813" font-size="14.5" font-weight="800" fill="#fff">View cart</text>
  <text x="360" y="813" font-size="14.5" font-weight="800" fill="#fff" text-anchor="end">$27.40</text>
</svg>
