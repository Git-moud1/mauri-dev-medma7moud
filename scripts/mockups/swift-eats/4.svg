<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif" role="img" aria-label="Swift Eats — Live order tracking">
  <defs>
    <linearGradient id="s4-map" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EEEC"/><stop offset="1" stop-color="#E2E9E6"/></linearGradient>
    <linearGradient id="s4-avatar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B7CF6"/><stop offset="1" stop-color="#5B7CFA"/></linearGradient>
    <linearGradient id="s4-route" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A4C"/><stop offset="1" stop-color="#F5471E"/></linearGradient>
    <filter id="s4-sheet" x="-30%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#2A1B3A" flood-opacity="0.14"/></filter>
    <filter id="s4-pin" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a2a26" flood-opacity="0.35"/></filter>
    <filter id="s4-ctash" x="-40%" y="-60%" width="180%" height="240%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C13A12" flood-opacity="0.4"/></filter>
    <clipPath id="s4-mapClip"><rect x="0" y="0" width="390" height="560"/></clipPath>
    <clipPath id="s4-thumb"><rect x="24" y="770" width="44" height="44" rx="12"/></clipPath>
  </defs>

  <!-- ===== MAP ===== -->
  <g clip-path="url(#s4-mapClip)">
    <rect x="0" y="0" width="390" height="560" fill="url(#s4-map)"/>
    <!-- city blocks -->
    <g fill="#DCE4E0">
      <rect x="30" y="90" width="90" height="70" rx="8"/><rect x="140" y="70" width="80" height="60" rx="8"/>
      <rect x="250" y="60" width="110" height="80" rx="8"/><rect x="20" y="200" width="70" height="90" rx="8"/>
      <rect x="300" y="200" width="80" height="110" rx="8"/><rect x="60" y="360" width="100" height="80" rx="8"/>
      <rect x="250" y="360" width="120" height="90" rx="8"/><rect x="120" y="330" width="70" height="60" rx="8"/>
    </g>
    <!-- park -->
    <rect x="150" y="180" width="130" height="120" rx="16" fill="#CFE6C6"/>
    <g fill="#B9DCAE"><circle cx="185" cy="215" r="12"/><circle cx="230" cy="235" r="16"/><circle cx="255" cy="270" r="12"/></g>
    <!-- water -->
    <path d="M0 470 Q 90 440 180 470 T 390 470 L 390 560 L 0 560 Z" fill="#CADFEA"/>
    <!-- roads -->
    <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
      <path d="M-10 175h410" stroke-width="16"/>
      <path d="M-10 330h410" stroke-width="14"/>
      <path d="M110 -10v580" stroke-width="16"/>
      <path d="M235 -10v480" stroke-width="14"/>
      <path d="M-10 90 L 200 110 L 390 60" stroke-width="10"/>
    </g>
    <g stroke="#EDF2EF" stroke-linecap="round" fill="none" stroke-dasharray="2 12">
      <path d="M-10 175h410" stroke-width="2"/><path d="M110 -10v580" stroke-width="2"/>
    </g>
    <!-- delivery route -->
    <path d="M296 150 C 300 230 214 246 205 312 S 168 402 150 452" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
    <path d="M296 150 C 300 230 214 246 205 312 S 168 402 150 452" fill="none" stroke="url(#s4-route)" stroke-width="6" stroke-linecap="round"/>
    <!-- restaurant pin (origin) -->
    <g filter="url(#s4-pin)" transform="translate(296,150)"><path d="M0 -22a15 15 0 0 1 15 15c0 10-15 24-15 24S-15 3-15 -7A15 15 0 0 1 0 -22z" fill="#16151A"/><circle cx="0" cy="-7" r="9" fill="#fff"/><g transform="translate(-4.5,-11.5)" stroke="#16151A" stroke-width="1.5" stroke-linecap="round"><path d="M1 0v9M4 0v3a1.5 1.5 0 0 1-3 0M7 0c-1.4 0-2 1.6-2 3.5S5.6 6 7 6v3"/></g></g>
    <!-- home pin (destination) -->
    <g filter="url(#s4-pin)" transform="translate(150,452)"><path d="M0 -22a15 15 0 0 1 15 15c0 10-15 24-15 24S-15 3-15 -7A15 15 0 0 1 0 -22z" fill="#F5471E"/><path d="M-6 -4l6-6 6 6M-4.5 -5v6.5h9v-6.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <!-- courier marker -->
    <g filter="url(#s4-pin)" transform="translate(205,300)"><circle r="19" fill="#fff"/><circle r="19" fill="none" stroke="#F5471E" stroke-width="2.5"/><g transform="translate(-10,-8)" fill="none" stroke="#F5471E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="13" r="3"/><circle cx="16" cy="13" r="3"/><path d="M6.5 13h7l2-6h2M13.5 7l-2 6M2 8h5"/></g></g>
  </g>

  <!-- status bar -->
  <text x="32" y="36" font-size="16" font-weight="700" fill="#16151A" letter-spacing="0.2">9:41</text>
  <g fill="#16151A"><rect x="306" y="24" width="3.5" height="11" rx="1.4"/><rect x="312" y="21" width="3.5" height="14" rx="1.4"/><rect x="318" y="18" width="3.5" height="17" rx="1.4"/><rect x="324" y="15" width="3.5" height="20" rx="1.4"/></g>
  <g transform="translate(346,30)" fill="none" stroke="#16151A" stroke-width="1.7" stroke-linecap="round"><path d="M-8 -6a11.5 11.5 0 0 1 16 0"/><path d="M-4.6 -1.8a6.6 6.6 0 0 1 9.2 0"/></g>
  <circle cx="346" cy="30" r="1.5" fill="#16151A"/>
  <rect x="356" y="23" width="22" height="11" rx="3" fill="none" stroke="#16151A" stroke-opacity="0.4" stroke-width="1.2"/><rect x="358" y="25" width="15" height="7" rx="1.6" fill="#16151A"/>

  <!-- back + recenter -->
  <g transform="translate(20,60)" filter="url(#s4-pin)"><circle cx="19" cy="19" r="19" fill="#fff"/><path d="M23 11l-8 8 8 8" fill="none" stroke="#16151A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(334,470)" filter="url(#s4-pin)"><circle cx="18" cy="18" r="18" fill="#fff"/><g transform="translate(18,18)" fill="none" stroke="#16151A" stroke-width="2" stroke-linecap="round"><circle r="4"/><path d="M0 -10v3M0 10v-3M-10 0h3M10 0h-3"/></g></g>

  <!-- ===== bottom sheet ===== -->
  <g filter="url(#s4-sheet)"><rect x="0" y="504" width="390" height="340" rx="28" fill="#fff"/></g>
  <rect x="175" y="518" width="40" height="5" rx="2.5" fill="#E2E0E8"/>

  <text x="24" y="560" font-size="22" font-weight="800" fill="#16151A">Arriving in 12 min</text>
  <rect x="286" y="540" width="80" height="26" rx="13" fill="#EAF7EC"/>
  <circle cx="300" cy="553" r="3.5" fill="#12B76A"/>
  <text x="310" y="557" font-size="11" font-weight="800" fill="#12905A">On the way</text>
  <text x="24" y="582" font-size="13" fill="#8C8B97">Estimated 8:42 PM · Yahya is 2.1 km away</text>

  <!-- progress stepper -->
  <g transform="translate(0,612)">
    <rect x="40" y="0" width="310" height="4" rx="2" fill="#ECEAF0"/>
    <rect x="40" y="0" width="192" height="4" rx="2" fill="#F5471E"/>
    <g>
      <circle cx="40" cy="2" r="9" fill="#F5471E"/><path d="M36 2l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="143" cy="2" r="9" fill="#F5471E"/><path d="M139 2l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="246" cy="2" r="12" fill="#fff" stroke="#F5471E" stroke-width="3"/><circle cx="246" cy="2" r="4.5" fill="#F5471E"/>
      <circle cx="350" cy="2" r="9" fill="#ECEAF0"/>
    </g>
    <g font-size="10" font-weight="600" text-anchor="middle">
      <text x="40" y="28" fill="#8C8B97">Confirmed</text>
      <text x="143" y="28" fill="#8C8B97">Preparing</text>
      <text x="246" y="28" fill="#F5471E" font-weight="800">On the way</text>
      <text x="350" y="28" fill="#C2C1CB">Delivered</text>
    </g>
  </g>

  <rect x="24" y="672" width="342" height="1" fill="#F1EFF4"/>

  <!-- courier card -->
  <circle cx="48" cy="716" r="26" fill="url(#s4-avatar)"/><text x="48" y="723" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Y</text>
  <circle cx="66" cy="734" r="8" fill="#fff"/><circle cx="66" cy="734" r="5" fill="#12B76A"/>
  <text x="86" y="710" font-size="16" font-weight="800" fill="#16151A">Yahya Ould Sidi</text>
  <g transform="translate(86,720)"><path d="M6 0l1.7 3.5 3.8.6-2.8 2.7.7 3.8L6 8.9 2.6 10.6l.7-3.8L.5 4.1l3.8-.6z" fill="#FFB020"/></g>
  <text x="106" y="729" font-size="12.5" font-weight="700" fill="#16151A">4.9</text>
  <text x="128" y="729" font-size="12.5" fill="#9A99A5">· Scooter · 4821 MR</text>
  <!-- chat -->
  <g transform="translate(276,694)"><circle cx="22" cy="22" r="22" fill="#F4F2F7"/><g transform="translate(11,12)" fill="none" stroke="#16151A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10l-6 5v-5H2a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></g></g>
  <!-- call -->
  <g transform="translate(324,694)" filter="url(#s4-ctash)"><circle cx="22" cy="22" r="22" fill="#F5471E"/><path d="M16 15c-1 0-2 1-2 2 0 6 5 11 11 11 1 0 2-1 2-2v-3l-4-2-2 2c-2-1-4-3-5-5l2-2-2-4z" fill="#fff"/></g>

  <!-- order summary row -->
  <rect x="20" y="762" width="350" height="60" rx="16" fill="#F7F6F9"/>
  <image href="__PH_track_thumb__" x="24" y="770" width="44" height="44" preserveAspectRatio="xMidYMid slice" clip-path="url(#s4-thumb)"/>
  <text x="80" y="786" font-size="13.5" font-weight="800" fill="#16151A">Napoli Pizza House</text>
  <text x="80" y="804" font-size="12" fill="#9A99A5">3 items · Order #SE-4821</text>
  <text x="354" y="796" font-size="13" font-weight="800" fill="#F5471E" text-anchor="end">Details</text>
</svg>
