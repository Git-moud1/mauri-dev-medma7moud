<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif" role="img" aria-label="AURA — Storefront">
